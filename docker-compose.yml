services:
  # 1. C# API Mikroservice (Ingestion)
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db_mssql;Database=TalonSecurityDb;User=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      - RabbitMQ__HostName=rabbitmq
    depends_on:
      - db_mssql
      - rabbitmq

  # 2. C# Background Worker (Processing & Rules)
  worker:
    build:
      context: .
      dockerfile: Worker/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db_mssql;Database=TalonSecurityDb;User=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      - RabbitMQ__HostName=rabbitmq
    depends_on:
      - db_mssql
      - rabbitmq

# 3. Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  # 4. MS SQL Database
  db_mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    ports:
      - "1533:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql

  # 5. Nextcloud Database (MySQL)
  db_nextcloud:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}

  # 6. Nextcloud Service
  nextcloud:
    image: nextcloud:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - MYSQL_HOST=db_nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    depends_on:
      - db_nextcloud

  # 7. WAF
  waf:
    image: owasp/modsecurity-crs:nginx
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - BACKEND=http://nextcloud:80
      - PROXY=1
      - SERVER_NAME=localhost
      - ModSecRuleEngine=On
      - PORT=8080
    depends_on:
      - nextcloud

volumes:
  mysql_data:
  mssql_data:
  nextcloud_data: