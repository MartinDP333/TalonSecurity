services:
  db-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - talon_internal

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - talon_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - talon_internal

  talon-api:
    build:
      context: .
      dockerfile: API/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=db-mssql;Database=TalonSecurityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      - db-mssql
      - rabbitmq
    networks:
      - talon_internal

  waf:
    image: owasp/modsecurity-crs:nginx
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      BACKEND: http://talon-api:8080
      PROXY: "1"
      SERVER_NAME: localhost
      ModSecRuleEngine: On
      PORT: "8080"
    depends_on:
      - talon-api
    networks:
      - talon_internal

networks:
  talon_internal:
    driver: bridge

volumes:
  mssql_data:
  rabbitmq_data:
  redis_data:
