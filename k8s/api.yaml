apiVersion: apps/v1
kind: Deployment
metadata:
  name: talon-api
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: talon-api
  template:
    metadata:
      labels:
        app: talon-api
    spec:
      containers:
      - name: api
        image: martin313/talon-api:latest
        imagePullPolicy: Always  
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: talon-secrets
              key: MSSQL_SA_PASSWORD
        - name: ConnectionStrings__DefaultConnection
          value: "Server=db-mssql;Database=TalonSecurityDb;User Id=sa;Password=$(MSSQL_SA_PASSWORD);TrustServerCertificate=True"
        - name: RabbitMQ__HostName
          value: "rabbitmq"
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: talon-secrets
              key: RABBITMQ_DEFAULT_USER
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: talon-secrets
              key: RABBITMQ_DEFAULT_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: talon-api-service
spec:
  type: NodePort 
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
  selector:
    app: talon-api