apiVersion: apps/v1
kind: Deployment
metadata:
  name: talon-worker
  labels:
    app: talon-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talon-worker
  template:
    metadata:
      labels:
        app: talon-worker
    spec:
      containers:
      - name: worker
        image: martin313/talon-worker:database-fix-20261015-v3
        imagePullPolicy: Always
        env:
        - name: RabbitMQ__HostName
          value: "rabbitmq"
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: talon-secrets
              key: RABBITMQ_DEFAULT_USER
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: talon-secrets   
              key: RABBITMQ_DEFAULT_PASS
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: talon-secrets
              key: MSSQL_SA_PASSWORD
        - name: ConnectionStrings__DefaultConnection
          value: "Server=db-mssql;Database=TalonSecurityDb;User Id=sa;Password=$(MSSQL_SA_PASSWORD);TrustServerCertificate=True"
        - name: ConnectionStrings__Redis
          value: "redis:6379"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"